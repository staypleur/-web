name: Update latest blog posts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-blog.yml'
      - 'scripts/update_blog.py'

permissions:
  contents: write

concurrency:
  group: update-blog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest public posts and images
        run: python scripts/update_blog.py
      - name: Save changed feed
        run: |
          git add dist/blog
          if git diff --cached --quiet; then
            echo 'No blog changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh latest Naver blog posts'
          git pull --rebase origin main
          git push origin HEAD:main
